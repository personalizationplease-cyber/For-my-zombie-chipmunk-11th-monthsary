<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy 11 Monthsary</title>
<style>
  body { background: #141414; color: #f2f2f2; font-family: ui-monospace, Menlo, Consolas, monospace;
         display: flex; justify-content: center; min-height: 100vh; margin: 0; }
  #scene { position: relative; width: 100%; max-width: 640px; min-height: 140px;
           overflow: hidden; text-align: center; padding: 32px 12px; }
  .pink { color: #ff9ec4; } .green { color: #58c47c; } .straw { color: #ff5a5a; } .neutral { color: #b5b5b5; }
  pre { font-size: 11px; line-height: 1.15; margin: 0 auto; display: inline-block; text-align: left; }
  .link { background: none; border: none; cursor: pointer; color: #ff9ec4; text-decoration: underline;
          font-size: 16px; padding: 8px; font-family: inherit; }
  .rect { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
          border: 1px solid #ff9ec4; border-radius: 10px; background: none; cursor: pointer;
          padding: 14px 48px; font-size: 15px; letter-spacing: 2px; color: #ff9ec4; font-family: inherit;
          transition: opacity 900ms ease, transform 900ms ease; }
  .rect.gone { opacity: 0; transform: translateX(-50%) scale(1.6); }
  .stage { animation: fadeIn 800ms ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  #rain { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #rain .drop { position: absolute; top: -48px; font-size: 11px; line-height: 1;
                animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(900px) rotate(24deg); opacity: 0.9; } }
  .clickme { background: none; border: none; cursor: pointer; color: #ff9ec4; text-decoration: underline;
             font-size: 14px; margin-top: 4px; font-family: inherit; }
  .letter { border: 1px solid #4a4a4a; border-radius: 12px; padding: 20px; margin: 16px auto 0;
            max-width: 480px; text-align: left; font-size: 15px; line-height: 1.7;
            white-space: pre-wrap; font-family: ui-sans-serif, system-ui, sans-serif;
            animation: fadeIn 900ms ease-out both; }
  .nick { font-weight: 600; display: inline-block; }
  .nick.pop { animation: nickPop 450ms ease-out; }
  @keyframes nickPop { 0% { opacity: 0; transform: translateY(6px) scale(0.85); } 100% { opacity: 1; transform: none; } }
  .nick-bebi     { color: #ffc2d6; }
  .nick-baby     { color: #ff4d6d; }
  .nick-love     { color: #b48ce8; }
  .nick-ganda    { color: #3a5bbf; }
  .nick-princess { color: #ff77b3; }
  .nz0 { color: #a5e8b0; }
  .nz1 { color: #58c47c; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div id="scene">
  <div id="s1" class="stage"><button class="link" id="startLink">click me</button></div>
  <button class="rect" id="rectBtn" style="display:none">click</button>
  <div id="s3" style="display:none"></div>
  <div id="rain" style="display:none"></div>
  <div id="s4" style="display:none"></div>
  <div id="s5" style="display:none"></div>
</div>
<script>
var GREEN='green', NEU='neutral';
var dude = [
  ["          \\\\|//", GREEN],
  ["      ,-~~~~~~~~-,", 'straw'],
  ["     /  o      o  \\", 'straw'],
  ["    |      __       |", 'straw'],
  ["    |    (____)    |", 'straw'],
  ["     \\            /", 'straw'],
  ["   ___\\          /___", GREEN],
  ["  /   \\  ______  /   \\", GREEN],
  [" |     \\(    ) /     |", GREEN],
  [" |  /   (____)   \\   |", GREEN],
  ["  \\/             \\/", GREEN],
  ["", ''],
  ["      [ ALEXZANDER ]", NEU]
];
var nicks = [
  { text: 'zombie chipmunk', mode: 'zombie' },
  { text: 'bebi',            mode: 'bebi' },
  { text: 'baby',            mode: 'baby' },
  { text: 'love love',       mode: 'love' },
  { text: 'ganda',           mode: 'ganda' },
  { text: 'princess',        mode: 'princess' }
];
var s1=document.getElementById('s1'), rect=document.getElementById('rectBtn'),
    s3=document.getElementById('s3'), rain=document.getElementById('rain'),
    s4=document.getElementById('s4'), s5=document.getElementById('s5'),
    scene=document.getElementById('scene');
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

// colors
function mix(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)]; }
function css(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
var WHITE=[255,255,255];
var danger=[255,77,109], positive=[88,196,124], chart4=[180,140,232];
var pink  = mix(danger, WHITE, 0.55);
var pinkL = mix(danger, WHITE, 0.78);
var pinkD = mix(danger, WHITE, 0.28);
var red   = danger, green = positive, greenL = mix(positive, WHITE, 0.45);

// 3d bouquet
var W=560, H=500;
var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
cv.style.width='100%'; cv.style.maxWidth=W+'px';
var ctx=cv.getContext('2d');
var MONO='ui-monospace, Menlo, Consolas, monospace';

var N=18, flowers=[];
var petalCols=[pink,pinkL,pinkD,pink,red,pinkL,chart4,pink,[255,208,110],pink,[245,245,245],[255,170,110],pinkD,pink,red,pinkL,pink,[255,208,110]];
for(var i=0;i<N;i++){
  var rr=Math.sqrt((i+0.5)/N);
  flowers.push({
    phi: i*2.39996 + (Math.random()-0.5)*0.3,
    r: (0.3+0.85*rr)*2.1,
    y: 1.7 - rr*1.75 + (Math.random()-0.5)*0.25,
    c: petalCols[i%petalCols.length],
    s: 0.85+Math.random()*0.4,
    delay: (i/N)*0.75,
    sway: Math.random()*6.28
  });
}
var sparks=[];
for(var j=0;j<26;j++) sparks.push({x:Math.random()*W, y:Math.random()*H, v:0.15+Math.random()*0.4, tw:Math.random()*6.28});

var t0=null, rainStarted=false;

function drawTulip(sx, sy, sz, col){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var f=Math.max(6, Math.round(13*sz));
  ctx.font='500 '+f+'px '+MONO;
  ctx.fillStyle=css(mix(col, WHITE, 0.35));
  ctx.fillText('@ @ @', sx, sy-f*1.05);
  ctx.fillStyle=css(col);
  ctx.fillText('( @ )', sx, sy);
  ctx.fillStyle=css(mix(col,[40,40,60],0.35));
  ctx.fillText('\\___/', sx, sy+f*1.05);
}
function drawStem(x1,y1,x2,y2,sz){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='400 '+Math.max(6,Math.round(10*sz))+'px '+MONO;
  var steps=Math.max(3, Math.round((y2-y1)/(9*sz)));
  for(var k=0;k<=steps;k++){
    var t=k/steps, px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
    ctx.fillStyle = (k%3===0)? css(greenL) : css(green);
    ctx.fillText('|', px, py);
  }
}
function drawVase(cx, baseY, bob){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='500 13px '+MONO;
  var rows=[
    ['   _________________   ', css(pink)],
    ['  \\~~~~~~~~~~~~~~~~~/  ', css(pinkL)],
    ['   |||||||||||||||||   ', css(green)],
    ['    \\_____________/    ', css(mix([160,160,170],WHITE,0.2))]
  ];
  for(var r=0;r<rows.length;r++) ctx.fillText(rows[r][0], cx, baseY + r*14 + bob);
}
function frame(ts){
  if(t0===null) t0=ts;
  var el=(ts-t0)/1000;
  var bloom=Math.min(1, el/4.2);
  if(!rainStarted && bloom>=0.9){ rainStarted=true; startRain(); }
  var a=el*0.35;
  ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H*0.40, F=520, unit=62;
  var order=[];
  for(var i=0;i<N;i++){
    var fl=flowers[i];
    var x=Math.cos(fl.phi)*fl.r, z=Math.sin(fl.phi)*fl.r;
    var xr=x*Math.cos(a)+z*Math.sin(a);
    var zr=-x*Math.sin(a)+z*Math.cos(a);
    var sc=F/(F+zr*unit);
    var p=Math.max(0, Math.min(1, (bloom-fl.delay)/0.25));
    var e=1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2);
    var sz=fl.s*sc*e;
    var sx=cx+xr*unit*sc + Math.sin(el*1.2+fl.sway)*2*sz;
    var sy=cy - fl.y*unit*sc*0.5 - 20 + Math.cos(el+fl.sway)*2*sz;
    order.push({fl:fl, sx:sx, sy:sy, sz:sz, zr:zr, xr:xr, sc:sc, p:p});
  }
  order.sort(function(m,n){ return n.zr-m.zr; });
  var vaseTop=H*0.72, baseY=H*0.74;
  var bob=Math.sin(el*1.5)*2;
  order.forEach(function(o){
    if(o.p<=0) return;
    drawStem(o.sx, o.sy+14*o.sz, cx+o.xr*unit*o.sc*0.22, vaseTop+bob, o.sz*o.p);
  });
  order.forEach(function(o){
    if(o.p<=0) return;
    ctx.globalAlpha=Math.min(1,o.p*1.4);
    drawTulip(o.sx, o.sy, o.sz*o.p, o.fl.c);
    ctx.globalAlpha=1;
  });
  drawVase(cx, baseY, bob);
  ctx.font='400 9px '+MONO;
  sparks.forEach(function(sp){
    sp.y-=sp.v; sp.tw+=0.05;
    if(sp.y<-10){ sp.y=H+10; sp.x=Math.random()*W; }
    ctx.globalAlpha=0.25+0.55*Math.abs(Math.sin(sp.tw));
    ctx.fillStyle=css(Math.random()<0.5? pinkL : WHITE);
    ctx.fillText('*', sp.x+Math.sin(sp.tw)*6, sp.y);
  });
  ctx.globalAlpha=1;
  ctx.font='500 13px '+MONO;
  ctx.fillStyle=css(pink);
  ctx.fillText('. ~ for you ~ .', cx, H-16);
  requestAnimationFrame(frame);
}

document.getElementById('startLink').onclick = function(){
  s1.style.display='none'; rect.style.display='block'; scene.style.minHeight='560px';
};
rect.onclick = function(){ rect.classList.add('gone'); setTimeout(startBouquet, 900); };
function startBouquet(){
  rect.style.display='none'; s3.style.display='block'; s3.className='stage';
  s3.appendChild(cv);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  requestAnimationFrame(frame);
}
function startRain(){
  rain.style.display='block';
  var end = Date.now() + 11000;
  var iv = setInterval(function(){
    if(Date.now() > end){ clearInterval(iv); rain.style.display='none'; showDude(); return; }
    var d = el('div', 'drop');
    d.appendChild(el('span','green','\\_/'));
    d.appendChild(document.createElement('br'));
    d.appendChild(el('span','straw','(*)'));
    d.style.left = (Math.random()*92) + '%';
    d.style.animationDuration = (1.6 + Math.random()) + 's';
    rain.appendChild(d);
    d.addEventListener('animationend', function(){ d.remove(); });
  }, 110);
}
function setNick(span, n){
  span.innerHTML = '';
  if(n.mode === 'zombie'){
    n.text.split('').forEach(function(ch, i){ span.appendChild(el('span', 'nz' + (i % 2), ch)); });
  } else {
    span.appendChild(el('span', 'nick-' + n.mode, n.text));
  }
  span.classList.remove('pop'); void span.offsetWidth; span.classList.add('pop');
}
function showDude(){
  s4.style.display='block'; s4.className='stage';
  var pre = el('pre'); s4.appendChild(pre);
  dude.forEach(function(r){
    pre.appendChild(el('span', r[1], r[0]));
    pre.appendChild(document.createTextNode('\n'));
  });
  var btn = el('button','clickme','click me');
  s4.appendChild(document.createElement('br'));
  s4.appendChild(btn);
  btn.onclick = function(){
    btn.style.display='none'; s5.style.display='block';
    var letter = el('div','letter');
    letter.appendChild(el('span', null, "Happy 11 MONTHSARY MY "));
    var nick = el('span','nick'); letter.appendChild(nick);
    letter.appendChild(el('span', null,
", well maybe it's your anniversary of liking me but hell.. THATS STILLL GREATTT, you know im really grateful for you, to the point that I just wanna glue my soul in your soul so were one hehe. I made this so I can finnaly start coding again. I may have vibe coded too but I'm still using my creativity and other tricks that I learned back then, I just love you so much so friggin much.\n\nSincerely your love and baby,\nAlexzander"));
    s5.appendChild(letter);
    var idx = 0;
    setNick(nick, nicks[0]);
    setInterval(function(){ idx = (idx + 1) % nicks.length; setNick(nick, nicks[idx]); }, 1500);
  };
}
</script>
</body>
</html>
